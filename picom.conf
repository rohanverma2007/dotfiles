# High-Performance Picom Configuration
# Place at: ~/.config/picom.conf

#################################
#          Performance          #
#################################

# Backend - Use GLX for NVIDIA
backend = "glx";

# Enable hardware acceleration
glx-no-stencil = true;
glx-no-rebind-pixmap = true;
glx-copy-from-front = false;
use-damage = true;

# VSync - Essential for tear-free experience
vsync = true;

#################################
#           Shadows             #
#################################

# Disable shadows for maximum performance
shadow = false;

#################################
#           Fading              #
#################################

# Disable fading for better performance
fading = false;

#################################
#   Transparency/Opacity        #
#################################

# Disable inactive opacity for performance
inactive-opacity-override = false;

# Window type specific opacity (optional - comment out for max performance)
# opacity-rule = [
#   "95:class_g = 'Alacritty' && focused",
#   "85:class_g = 'Alacritty' && !focused"
# ];

#################################
#         Animations            #
#################################

# Disable animations for maximum performance
animations = false;

#################################
#           Corners             #
#################################

# Disable rounded corners for performance
corner-radius = 0;

#################################
#       General Settings        #
#################################

# Daemon mode
daemon = true;

# Don't draw shadows on drag-and-drop windows
no-dnd-shadow = true;

# Don't draw shadows on dock/panel windows
no-dock-shadow = true;

# Zero the part of the shadow's mask behind the window
clear-shadow = true;

# Detect rounded corners and treat them as rectangular
detect-rounded-corners = true;

# Detect '_NET_WM_OPACITY' on client windows
detect-client-opacity = true;

# Use 'WM_TRANSIENT_FOR' to group windows, and consider windows
# in the same group focused at the same time
detect-transient = true;

# Mark wmwin-focused windows as active
mark-wmwin-focused = true;

# Mark override-redirect windows as active
mark-ovredir-focused = true;

# Use EWMH '_NET_ACTIVE_WINDOW' to determine focused window
use-ewmh-active-win = true;

# Unredir all windows if a full-screen opaque window is detected
unrestrict-on-monitor = true;

#################################
#        Window Rules           #
#################################

# Window type settings - optimized for performance
wintypes:
{
  tooltip = { fade = false; shadow = false; opacity = 1.0; focus = true; full-shadow = false; };
  dock = { shadow = false; clip-shadow-above = true; };
  dnd = { shadow = false; };
  popup_menu = { opacity = 1.0; shadow = false; fade = false; };
  dropdown_menu = { opacity = 1.0; shadow = false; fade = false; };
  above = { shadow = false; };
  splash = { shadow = false; };
  utility = { focus = true; shadow = false; blur-background = false; };
  notification = { shadow = false; fade = false; };
  desktop = { shadow = false; blur-background = false; };
  menu = { focus = true; };
  dialog = { focus = true; };
  normal = { focus = true; };
};

#################################
#         Focus Rules           #
#################################

# Always focus these windows
focus-exclude = [
  "class_g = 'Cairo-clock'",
  "class_g ?= 'rofi'",
  "class_g ?= 'Polybar'",
  "_GTK_FRAME_EXTENTS@:c"
];

#################################
#          Blur (Disabled)      #
#################################

# Disable blur for maximum performance
blur-background = false;
