# foot terminal config with sourcerer colorscheme
# Use the exact name as shown by fc-list
[main]
font=ProggySquare.pcf:pixelsize=16:spacing=mono:antialias=false

# Or try
#font=ProggySquareSZ.pcf:pixelsize=11:spacing=mono:antialias=false

dpi-aware=no

shell=/usr/bin/fish

[colors]
background=0f1a0f
foreground=c2c2b0
alpha=0.9

#cursor=c2c2b0        # Add this line to your existing colors

# Normal colors (0-7)
regular0=1c1c1c   # black
regular1=ff6a6a   # red
regular2=779b70   # green  
regular3=cc8800   # yellow
regular4=90b0d1   # blue
regular5=8f6f8f   # magenta
regular6=528b8b   # cyan
regular7=c2c2b0   # white
# Bright colors (8-15)
bright0=2d2d2d    # bright black
bright1=ff9800    # bright red
bright2=719611    # bright green
bright3=faf4c6    # bright yellow
bright4=1e90ff    # bright blue
bright5=9ebac2    # bright magenta
bright6=87ceeb    # bright cyan
bright7=ffffff    # bright white
# Selection colors
selection-foreground=222222
selection-background=c2c2b0

[scrollback]
lines=10000

[url]
launch=xdg-open ${url}

[tweak]
font-monospace-warn=no
# This is the only valid box-drawing option
box-drawing-base-thickness=0.04

[key-bindings]
clipboard-copy=Control+Shift+c
clipboard-paste=Control+Shift+v
font-increase=Control+plus Control+equal
font-decrease=Control+minus
font-reset=Control+0

[cursor]
style=beam
blink=yes
color=c2c2b0 c2c2b0
beam-thickness=1.5
